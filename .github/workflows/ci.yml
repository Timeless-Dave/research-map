name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Generated catalog is up to date
        run: |
          pnpm run generate:places
          git diff --exit-code src/lib/campus-places.generated.ts

      - name: Asset budget
        run: pnpm run check:assets
      - name: Illustrated geometry, budgets, snapshot and worker freshness
        run: pnpm run check:illustrated

      # Geometry plus structural road access for drive-to anchors. Does NOT
      # prove pedestrian-network connectivity, and structural reachability is not
      # campus verification — see README "Navigation anchors".
      - name: Navigation anchor geometry and road access
        run: pnpm run validate:anchors -- --require-network

      - name: Build
        run: pnpm run build
        env:
          # A missing map key must not be the reason the compile check fails.
          NEXT_PUBLIC_MAPTILER_KEY: ci-placeholder
          NEXT_PUBLIC_ILLUSTRATED_MAP: 'true'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Require browser basemap configuration
        run: test -n "$NEXT_PUBLIC_MAPTILER_KEY"
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
      - name: Browser tests
        run: pnpm run test:e2e
        env:
          NEXT_PUBLIC_MAPTILER_KEY: ${{ secrets.NEXT_PUBLIC_MAPTILER_KEY }}
          NEXT_PUBLIC_ILLUSTRATED_MAP: 'true'
          # Directions tests intercept requests; never call the paid provider.
          NEXT_PUBLIC_MAPBOX_TOKEN: ci-mocked-directions-token
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod
